<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovative Birthday Card</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #FFDEE9, #B5FFFC);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 80%;
            max-width: 800px;
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
            position: relative;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 3rem;
            color: #FF5678;
            margin-bottom: 20px;
            position: relative;
        }

        h1::before, h1::after {
            content: "🎉";
            font-size: 2rem;
            position: absolute;
            color: #FF9E9E;
        }

        h1::before {
            left: -40px;
            top: 10px;
        }

        h1::after {
            right: -40px;
            top: 10px;
        }

        .images {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .images img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            border: 5px solid #FFB2C4;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .images img:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .decorative-line {
            width: 60%;
            height: 4px;
            margin: 20px auto;
            background: linear-gradient(90deg, #FF5678, #FFC3E5);
            border-radius: 2px;
        }

        .message {
            font-size: 1.5rem;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        .footer {
            font-size: 1rem;
            color: #888;
            font-style: italic;
        }

        /* Elementos decorativos alrededor */
        .flower {
            position: absolute;
            width: 80px;
            height: 80px;
            background: url('image3.png') no-repeat center/contain;
            opacity: 0.6;
            animation: float 4s infinite ease-in-out;
        }

        .flower:nth-child(1) {
            top: -20px;
            left: 10%;
        }

        .flower:nth-child(2) {
            top: 50%;
            left: -40px;
        }

        .flower:nth-child(3) {
            bottom: -30px;
            right: 10%;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="flower"></div>
        <div class="flower"></div>
        <div class="flower"></div>
        <h1>Happy Birthday!</h1>
        <div class="images">
            <img src="image1.png" alt="Image 1">
            <img src="image2.png" alt="Image 2">
        </div>
        <div class="decorative-line"></div>
        <p class="message">
            Wishing you a day filled with joy, laughter, and unforgettable memories. 
            May this year be the most wonderful yet!
        </p>
        <p class="footer">With love, your family ❤️</p>
    </div>
</body>
</html>
